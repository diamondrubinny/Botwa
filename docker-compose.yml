services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: botwa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: botwa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botwa"]
      interval: 5s
      retries: 10

  server:
    build: { context: ., dockerfile: apps/server/Dockerfile, args: { WITH_SEMANTIC: "${WITH_SEMANTIC:-0}", WITH_BROWSER: "${WITH_BROWSER:-0}" } }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://botwa:${DB_PASSWORD}@db:5432/botwa
      HOST: 0.0.0.0
      NODE_ENV: production
      TRUST_PROXY: "true"      # safe: port 3000 is NOT published, only Caddy can reach it
      MEDIA_DIR: /data/media
      BACKUP_DIR: /data/backups
      MODEL_DIR: /data/models
      CLAMAV_HOST: ${CLAMAV_HOST:-}   # set to "clamav" (and run with --profile media) to enable attachments
    networks: [default, webrender, officenet]
    volumes: [media:/data/media, backups:/data/backups, models:/data/models]     # quarantine/ + clean/ attachment storage (not web-accessible)
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional headless browser for pages built by JavaScript: `docker compose --profile browser up -d` (or scripts/enable-browser.sh).
  # Isolated on purpose: no database, no .env, no keys; it shares only a token with the server, sits on its own network (cannot reach the
  # database), and refuses non-public addresses itself. Chromium runs without its own sandbox inside this locked-down container.
  browser:
    build: { context: ., dockerfile: apps/server/Dockerfile, args: { WITH_SEMANTIC: "0", WITH_BROWSER: "1" } }
    profiles: ["browser"]
    restart: unless-stopped
    command: ["node", "dist/browser-server.js"]
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN:-}   # empty unless the browser profile is on: scripts/enable-browser.sh sets it (the service refuses to start without a token)
      BROWSER_NO_SANDBOX: "true"
      BROWSER_PATH: /usr/bin/chromium
      PORT: "3100"
      HOST: 0.0.0.0
    networks: [webrender]
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 300
    shm_size: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Antivirus for attachments. Optional: `docker compose --profile media up -d` (needs ~2-3GB RAM extra).
  clamav:
    image: clamav/clamav:stable
    profiles: ["media"]
    restart: unless-stopped
    volumes: [clamdb:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      retries: 5
      start_period: 300s   # first start downloads signatures

  # Optional local language model (Ollama) that words the bot's answers from the knowledge base only. Turned on by
  # scripts/enable-local-llm.sh (adds "llm" to COMPOSE_PROFILES, pins OLLAMA_VERSION, pulls the model). No port is published:
  # only the server reaches it on the internal network, and it never receives anything but knowledge-base passages and a question.
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    profiles: ["llm"]
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: "30m"     # keep the model in memory between questions (the first answer after a pause is slower)
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Optional Word -> PDF converter for digital forms: `bash scripts/enable-office.sh`. LibreOffice in a locked-down container on an
  # internal network with no way out (it cannot reach the internet or the database); it keeps nothing and never runs macros.
  office:
    build: { context: apps/office-converter }
    profiles: ["office"]
    restart: unless-stopped
    networks: [officenet]
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 200

  caddy:
    image: caddy:2
    # Built-in HTTPS reverse proxy. Skipped (not in COMPOSE_PROFILES) when an existing nginx fronts Botwa: see docker-compose.external.yml
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    # BIND_IP: bind only the public address (needed when another service, e.g. Tailscale, already listens on :443 of another IP)
    ports: ["${BIND_IP:-0.0.0.0}:80:80", "${BIND_IP:-0.0.0.0}:443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [server]

networks:
  webrender: {}
  officenet: { internal: true }   # the server and the Word converter only; no route out

volumes:
  ollama:
  backups:
  media:
  models:
  clamdb:
  pgdata:
  caddy_data:
  caddy_config:
