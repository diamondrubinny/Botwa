# Builds the Android app and publishes it on the "android-latest" release, where installed apps look for updates.
# Runs when something under android/ changes, or by hand (Actions -> Android app -> Run workflow).
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   BOTWA_KEYSTORE_B64       the signing keystore (.jks), base64-encoded
#   BOTWA_KEYSTORE_PASSWORD  its password
# Installed apps only accept updates signed with the same key.
name: Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      notes:
        description: 'What changed (shown on the release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Signing key
        env:
          KS_B64: ${{ secrets.BOTWA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BOTWA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add the repository secrets BOTWA_KEYSTORE_B64 and BOTWA_KEYSTORE_PASSWORD (see android/README.he.md)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/botwa.jks"

      - name: Build
        working-directory: android
        env:
          BOTWA_KEYSTORE: ${{ runner.temp }}/botwa.jks
          BOTWA_KEYSTORE_PASSWORD: ${{ secrets.BOTWA_KEYSTORE_PASSWORD }}
          BOTWA_KEY_ALIAS: botwa
        run: |
          CODE=$((100 + GITHUB_RUN_NUMBER))
          NAME="1.$GITHUB_RUN_NUMBER"
          ./gradlew --no-daemon assembleRelease -Pbotwa.versionCode=$CODE -Pbotwa.versionName=$NAME
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/Botwa.apk
          SHA=$(sha256sum ../out/Botwa.apk | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/Botwa.apk"
          printf '{"versionCode":%s,"versionName":"%s","apk":"%s","sha256":"%s","commit":"%s"}\n' "$CODE" "$NAME" "$URL" "$SHA" "$GITHUB_SHA" > ../out/version.json
          cat ../out/version.json
          rm -f "$BOTWA_KEYSTORE"

      - name: Publish (release "android-latest")
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release view android-latest > /dev/null 2>&1 || gh release create android-latest --title "Botwa Android" --notes "האפליקציה הפנימית לאנדרואיד. האפליקציות המותקנות בודקות כאן אם יש גרסה חדשה." --latest=false
          gh release upload android-latest out/Botwa.apk out/version.json --clobber
          gh release edit android-latest --notes "גרסה $(jq -r .versionName out/version.json) (commit ${GITHUB_SHA::7}). ${NOTES}"
